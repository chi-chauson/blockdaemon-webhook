server.port=8080

# The secret you set when creating the Blockdaemon webhook target.
# Used for the CRC challenge response and signature verification.
# Set via BLOCKDAEMON_WEBHOOK_SECRET environment variable or override here for local dev.
blockdaemon.webhook.secret=${BLOCKDAEMON_WEBHOOK_SECRET:your_webhook_secret_here}
blockdaemon.webhook.record-dir=output
blockdaemon.webhook.max-file-size-mb=20

# WebSocket streaming client — alternative to the webhook+tunnel flow above.
# No public endpoint needed: the app connects outbound to Blockdaemon instead.
# Set blockdaemon.websocket.enabled=true and target-id to a `type: "websocket"`
# target id (see `make create-ws-target`) to use it.
blockdaemon.api-key=${BLOCKDAEMON_API_KEY:}
blockdaemon.websocket.enabled=${BLOCKDAEMON_WEBSOCKET_ENABLED:false}
blockdaemon.websocket.target-id=${WEBSOCKET_TARGET_ID:}
blockdaemon.websocket.ack=true

# Log the full request body for debugging (disable in production)
logging.level.ly.bit.blockdaemon=DEBUG
